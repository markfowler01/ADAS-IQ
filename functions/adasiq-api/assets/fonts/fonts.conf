<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- librsvg (sharp) ignores @font-face; fonts must be installed through fontconfig.
     FONTCONFIG_PATH points here (index.js), so Inter / Playfair Display / Permanent
     Marker render as themselves instead of DejaVu fallbacks (found 2026-10-06). -->
<fontconfig>
  <dir>/catalyst/assets/fonts</dir>
  <dir prefix="cwd">assets/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <config></config>
</fontconfig>
