name: Marketing Crons (external watchdog)

# WHY THIS EXISTS:
# Catalyst's own cron system keeps silently disabling the marketing cron jobs
# (auto-disable triggered three separate times — May 24, June 13, June 16).
# This workflow runs on GitHub's infrastructure and hits the same routes from
# outside. Catalyst-independent — even if Catalyst's scheduler is fully broken,
# content still flows.
#
# Uses the NO-AUTH /debug/* endpoints (built into the function — they self-call
# the protected endpoints using the function's own BREW_CRON_SECRET env var,
# so we don't need a GitHub secret).
#
# Catalyst crons can stay enabled in parallel (belt + suspenders) — every cron
# route is idempotent (scheduler skips already-published, nurture dedupes per
# lead, holiday_poster has per-holiday cache key, drafters have Sunday-gate).
# Worst case: minor duplicate work, never duplicate posts.
#
# Times in cron lines are UTC. PT = UTC-7 (PDT) / UTC-8 (PST).

on:
  schedule:
    # Hourly publisher + nurture + email-monitor. +7min offset to dodge top-of-hour
    # GitHub scheduler rush.
    - cron: '7 * * * *'

    # DAILY 13:13 UTC (~ 6 AM PT) — daily Meta drafter (1 FB + 1 IG + 1 TT).
    # Daily replaces the old Sunday weekly batch — Mark wants posts every day,
    # and a daily run is more resilient (if one day fails, we lose 1 day, not 7).
    # LinkedIn is covered by the daily unified drafter (below). The old Sunday
    # weekly LI variant drafter was DISABLED 2026-07-03 — its pending drafts
    # kept blocking the daily unified drafter's LinkedIn slot via idempotence.
    - cron: '13 13 * * *'

    # Sunday LI drafter DISABLED — schedule commented for reference:
    #   - cron: '33 13 * * 0'

    # DAILY 13:01 UTC (~ 6:01 AM PT) — van-in-the-field pillar. Drafts the
    # day's van post (real van photo + Gemini scene) scheduled for 6:30 AM PT.
    - cron: '1 13 * * *'

    # Friday 15:47 UTC (~ 8:47 AM PT) — weekly report to Mark. Moved off
    # 14:17 (2026-08-13): GitHub silently DROPS schedules in its peak
    # 13:00-14:30 UTC congestion window — this job never ran once.
    - cron: '47 15 * * 5'

    # Daily 15:43 UTC (~ 8:43 AM PT) — engagement collector. Moved off
    # 13:23 (2026-08-13): same congestion-drop as friday-weekly.
    - cron: '43 15 * * *'

  # Manual trigger from GitHub UI — useful for one-off recovery or testing.
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually'
        required: true
        default: 'hourly'
        type: choice
        options:
          - hourly
          - daily-drafters
          - van-post
          - friday-weekly
          - daily-tasks

env:
  BASE: https://adas-iq-904191467.development.catalystserverless.com/server/adasiq-api/api/capture-calc/debug

jobs:
  # ── HOURLY ─────────────────────────────────────────────────────────────────
  hourly:
    if: github.event.schedule == '7 * * * *' || inputs.job == 'hourly'
    runs-on: ubuntu-latest
    steps:
      - name: capture_scheduler — publish in-window drafts
        run: |
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' --max-time 120 \
            "$BASE/run-scheduler")
          echo "HTTP $code"
          cat /tmp/r.json | head -c 2000; echo
          [ "$code" -lt 400 ] || exit 1

      - name: capture_nurture — drip emails to calculator leads
        run: |
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' --max-time 90 \
            "$BASE/nurture-run")
          echo "HTTP $code"
          cat /tmp/r.json | head -c 1500; echo
          [ "$code" -lt 400 ] || exit 1

      - name: li_comments — alert Mark on new LinkedIn comments
        run: |
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' --max-time 90 \
            "$BASE/li-comments-check")
          echo "HTTP $code"
          cat /tmp/r.json | head -c 1500; echo
          # Non-fatal: a LinkedIn API hiccup shouldn't fail the whole hourly
          [ "$code" -lt 500 ] || exit 1

      - name: cron_monitor — scan inbox for Catalyst auto-disable emails
        run: |
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' --max-time 60 \
            "$BASE/cron-monitor-run")
          echo "HTTP $code"
          cat /tmp/r.json | head -c 1000; echo
          [ "$code" -lt 400 ] || exit 1

  # ── DAILY META DRAFTER ─────────────────────────────────────────────────────
  # Fires every day at 13:13 UTC (~6 AM PT). Drafts 1 FB + 1 IG + 1 TT for
  # today's slot, scheduled for prime times that same day. Idempotent — skips
  # any channel that already has a live draft for today.
  # Drafter takes 60-120s; Catalyst's gateway returns 408 at 30s but inner
  # handler keeps running. Accept 408/curl-28 as "expected, work continues"
  # and verify via heartbeat after a wait.
  daily-drafters:
    if: github.event.schedule == '13 13 * * *' || inputs.job == 'daily-drafters'
    runs-on: ubuntu-latest
    steps:
      - name: capture_meta — generate today's FB + IG + TT drafts
        run: |
          set +e
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' --max-time 40 \
            "$BASE/draft-meta-day")
          curl_exit=$?
          echo "HTTP $code (curl exit $curl_exit) — 408 / curl-28 expected for long drafter"
          cat /tmp/r.json 2>/dev/null | head -c 500; echo
          if [ "$curl_exit" -eq 28 ] || [ -z "$code" ] || [ "$code" = "000" ]; then exit 0; fi
          if [ "$code" -ge 500 ]; then exit 1; fi
          exit 0

      - name: verify drafter completed (retry over ~12 min)
        run: |
          for attempt in 1 2 3 4; do
            sleep 180
            age=$(curl -sS --max-time 30 \
              "https://adas-iq-904191467.development.catalystserverless.com/server/adasiq-api/api/capture-calc/debug/heartbeats" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['heartbeats'].get('capture_meta',{}).get('last_success_age_min','none'))" 2>/dev/null)
            echo "attempt $attempt: capture_meta last_success_age_min=$age"
            case "$age" in
              none|'') ;; 
              *) if [ "${age%.*}" -le 20 ] 2>/dev/null; then echo "✅ drafter completed"; exit 0; fi ;;
            esac
          done
          echo "❌ capture_meta still no fresh success after ~12 min"
          exit 1

  # ── VAN-IN-THE-FIELD DAILY POST ────────────────────────────────────────────
  # Drafts the day's brand-presence van post (real van photo from Mark's
  # WorkDrive folder + Gemini image-to-image scene). Publishes 6:30 AM PT via
  # the hourly scheduler. Drafter takes 60-120s (Claude + Gemini + GitHub
  # commit); accept the 30s gateway timeout and verify via heartbeat.
  van-post:
    if: github.event.schedule == '1 13 * * *' || inputs.job == 'van-post'
    runs-on: ubuntu-latest
    steps:
      - name: van_post — draft today's van-in-the-field post
        run: |
          set +e
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' --max-time 40 \
            "$BASE/van-draft-day")
          curl_exit=$?
          echo "HTTP $code (curl exit $curl_exit) — 408 / curl-28 expected for long drafter"
          cat /tmp/r.json 2>/dev/null | head -c 500; echo
          if [ "$curl_exit" -eq 28 ] || [ -z "$code" ] || [ "$code" = "000" ]; then exit 0; fi
          if [ "$code" -ge 500 ]; then exit 1; fi
          exit 0

      # Verify by asking the definitive question — "does today's post
      # exist?" — instead of racing the heartbeat clock. The staggered
      # aa_van_post crons (6:01/6:05/6:09) can legitimately take ~10+
      # minutes end-to-end, which made the old 3-min heartbeat check a
      # false-alarm machine (fired Mark's personal email 2026-08-07).
      - name: verify today's post exists (retry over ~12 min)
        run: |
          for attempt in 1 2 3 4; do
            sleep 180
            resp=$(curl -sS --max-time 40 "$BASE/van-draft-day" 2>/dev/null)
            echo "attempt $attempt: $(echo "$resp" | head -c 300)"
            if echo "$resp" | grep -q "already have today's van post"; then
              echo "✅ van_post: today's post exists on all channels"
              exit 0
            fi
          done
          echo "❌ van_post: today's post still missing after ~12 minutes"
          exit 1

  # ── SUNDAY LINKEDIN DRAFTER — DISABLED 2026-07-03 ─────────────────────────
  # The daily unified drafter creates today's LI post automatically, and this
  # job's pending variant drafts kept blocking the unified drafter's LinkedIn
  # slot via idempotence. Guard set to `false` so it can't fire from cron or
  # manual dispatch. Kept in the file for reference.
  sunday-linkedin:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: capture_linkedin — generate the week's LinkedIn variants
        run: |
          set +e
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' --max-time 40 \
            "$BASE/draft-linkedin-week")
          curl_exit=$?
          echo "HTTP $code (curl exit $curl_exit) — 408 / curl-28 expected for long drafter"
          cat /tmp/r.json 2>/dev/null | head -c 500; echo
          if [ "$curl_exit" -eq 28 ] || [ -z "$code" ] || [ "$code" = "000" ]; then exit 0; fi
          if [ "$code" -ge 500 ]; then exit 1; fi
          exit 0

      - name: wait 3 min then verify drafter completed via heartbeat
        run: |
          sleep 180
          curl -sS --max-time 30 \
            "https://adas-iq-904191467.development.catalystserverless.com/server/adasiq-api/api/capture-calc/debug/heartbeats" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['heartbeats']
          fail = False
          hb = d.get('capture_linkedin', {})
          age = hb.get('last_success_age_min')
          if age is None or age > 10:
              print(f'❌ capture_linkedin: last_success_age_min={age} — drafter did not complete')
              fail = True
          else:
              print(f'✅ capture_linkedin: last_success_age_min={age}m')
          sys.exit(1 if fail else 0)
          "

  # ── FRIDAY WEEKLY REPORT ───────────────────────────────────────────────────
  friday-weekly:
    if: github.event.schedule == '47 15 * * 5' || inputs.job == 'friday-weekly'
    runs-on: ubuntu-latest
    steps:
      - name: capture_weekly — Friday digest to Mark
        run: |
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' --max-time 60 \
            "$BASE/weekly-run")
          echo "HTTP $code"
          cat /tmp/r.json | head -c 1500; echo
          [ "$code" -lt 400 ] || exit 1

  # ── DAILY ──────────────────────────────────────────────────────────────────
  daily-tasks:
    if: github.event.schedule == '43 15 * * *' || inputs.job == 'daily-tasks'
    runs-on: ubuntu-latest
    steps:
      - name: capture_engagement — pull post-engagement stats
        run: |
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}' --max-time 60 \
            "$BASE/engagement-run")
          echo "HTTP $code"
          cat /tmp/r.json | head -c 1500; echo
          [ "$code" -lt 400 ] || exit 1

      # holiday_poster step REMOVED 2026-08-13 — /api/holiday-poster/run was
      # never actually implemented (404). Re-add when the feature ships.
