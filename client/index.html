<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absolute ADAS Platform</title>
    <meta name="description" content="Absolute ADAS — mobile ADAS calibration & diagnostics operations platform. Job board, invoicing, and reporting." />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- PWA — manifest + standalone mode make iOS treat the home-screen
         app as installable, which is required for Web Push (iOS 16.4+). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Absolute ADAS" />
    <meta name="theme-color" content="#f5f3f0" />
    <!-- Open Graph -->
    <meta property="og:title" content="Absolute ADAS Platform" />
    <meta property="og:description" content="Mobile ADAS calibration & diagnostics — job board, invoicing, and reporting." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Boot splash — shows instantly while the app JS downloads; React
         replaces #root's contents the moment it mounts. Mirrors
         src/components/LoadingSplash.jsx. -->
    <style>
      @keyframes aa-scan { from { transform: translateY(144px); } to { transform: translateY(13px); } }
    </style>
    <!-- Boot watchdog (Mark 2026-09-11/14 white page): if the app has not
         drawn anything 8s after load — stale index pointing at deleted
         chunks, or a crash that emptied the root — reload ONCE with a
         cache-busting address. Guarded so it can never loop. -->
    <script>
      (function () {
        try {
          var key = 'adas_boot_reload_at';
          var last = Number(sessionStorage.getItem(key) || 0);
          setTimeout(function () {
            var root = document.getElementById('root');
            var empty = !root || root.children.length === 0 || (root.innerText || '').trim().length < 20;
            if (empty && Date.now() - last > 120000) {
              sessionStorage.setItem(key, String(Date.now()));
              var u = location.pathname + '?v=' + Date.now() + (location.hash || '');
              location.replace(u);
            }
          }, 8000);
        } catch (e) {}
      })();
    </script>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f3f0;font-family:'IBM Plex Sans',system-ui,sans-serif;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:20px;">
          <div style="position:relative;width:208px;height:168px;">
            <img src="/logo.png" alt="Absolute ADAS" style="position:absolute;left:20px;top:0;width:168px;height:168px;object-fit:contain;" />
            <div style="position:absolute;left:0;right:0;top:0;height:0;animation:aa-scan 4.2s ease-in-out infinite alternate;">
              <div style="position:absolute;left:0;right:0;top:-14px;height:28px;background:linear-gradient(to bottom, transparent, #CD441922 40%, #CD441933 50%, #CD441922 60%, transparent);"></div>
              <div style="position:absolute;left:0;right:0;top:-1px;height:2px;border-radius:2px;background:linear-gradient(to right, transparent, #ff6a3d 12%, #ffd2c2 50%, #ff6a3d 88%, transparent);box-shadow:0 0 8px 2px #CD441999, 0 0 18px 4px #CD441944;"></div>
            </div>
          </div>
          <div style="font-weight:800;font-size:15px;letter-spacing:0.14em;text-transform:uppercase;color:#1a1a1a;">
            Absolute <span style="color:#CD4419;">ADAS</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
